name: quality

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: cash-track/.github/.github/workflows/quality-node.yml@main
    secrets: inherit
    with:
      # Same floating LTS as the Dockerfile's node:lts-alpine, so CI runs the release's npm.
      node-version: 'lts/*'
      test-command: 'npm run test:ci'
